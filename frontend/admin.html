<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админка — MOGGED Краснодар</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <h1>🎭 MOGGEатр</h1>
  <nav class="nav">
    <a href="index.html">Афиша</a>
    <a href="admin.html" class="active">Админка</a>
  </nav>
</header>

<main class="container">
  <h2>Админка</h2>

  <section class="admin-section">
    <h3>Добавить спектакль</h3>
    <form id="add-play-form" class="admin-form">
      <label>Название: <input type="text" id="play-title-input" required></label>
      <label>Дата и время: <input type="datetime-local" id="play-date-input" required></label>
      <label>Цена (₽): <input type="number" id="play-price-input" min="0" required></label>
      <label>Всего мест: <input type="number" id="play-seats-input" min="1" max="200" value="50" required></label>
      <button type="submit" class="btn-primary">Добавить</button>
    </form>
  </section>

  <section class="admin-section">
    <h3>Список спектаклей</h3>
    <table class="admin-table" id="admin-plays-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Название</th>
          <th>Дата</th>
          <th>Цена</th>
          <th>Мест</th>
          <th>Действия</th>
        </tr>
      </thead>
      <tbody id="admin-plays-body">
        <tr><td colspan="6" class="loading">Загрузка...</td></tr>
      </tbody>
    </table>
  </section>

  <p class="admin-note">

  </p>
</main>

<footer class="footer">
  <p>© 2026 MOGGED Краснодар. Учебный проект.</p>
</footer>

<script src="script.js"></script>
<script>
  initAdminPage();
</script>
</body>
</html>
